[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "structured-dispatch-api"
version = "1.0.0"
description = "An authenticated, asynchronous Gemini structured-dispatch service."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anyio>=4.8,<5",
    "fastapi>=0.115,<1",
    "google-api-core>=2.24,<3",
    "google-auth>=2.38,<3",
    "google-generativeai==0.8.6",
    "limits>=5.8,<6",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2.1,<6",
    "slowapi==0.1.9",
    "starlette>=0.47,<2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-redis>=4.6,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
exclude = [
    "/.venv",
    "/venv",
    "/*venv*",
    "/dist",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.coverage",
    "/htmlcov",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/venv",
    "/*venv*",
    "/dist",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.coverage",
    "/htmlcov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Intentional legacy dependency retained as an explicit stack constraint.
    "ignore::FutureWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D", "ASYNC", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "S106", "S311"]
# These test doubles must match the vendor's timeout keyword, not expose our own API.
"tests/test_services.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi", "slowapi.*", "limits", "limits.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
